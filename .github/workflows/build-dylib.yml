name: Build KDDictationInject.dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Source/**'
      - '.github/workflows/build-dylib.yml'
      - 'build.sh'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build arm64 dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDDictationInject
          path: out/*
          if-no-files-found: error
